<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; overflow: hidden; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-world { width: 600px; height: 300px; background: linear-gradient(#4488ff, #99ccff); border: 4px solid #fff; position: relative; overflow: hidden; }
        
        /* Scrolling Clouds */
        .cloud { position: absolute; width: 100px; height: 40px; background: #fff; border-radius: 20px; opacity: 0.8; animation: moveClouds 20s linear infinite; }
        @keyframes moveClouds { from { left: 600px; } to { left: -150px; } }

        /* Scrolling Trees (Parallax) */
        .tree { position: absolute; bottom: 40px; width: 40px; height: 80px; background: #2d5a27; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); animation: scroll 4s linear infinite; }
        
        /* The Hero */
        #hero {
            position: absolute; bottom: 40px; left: 100px; width: 40px; height: 50px;
            background: #ff4d4d; border-radius: 5px; border: 2px solid #333;
            animation: walk 0.5s ease-in-out infinite alternate;
        }
        #hero::after { content: "⚔️"; position: absolute; right: -20px; top: 10px; font-size: 20px; }
        
        .ground { position: absolute; bottom: 0; width: 100%; height: 40px; background: #4e3524; border-top: 6px solid #27ae60; }

        @keyframes scroll { from { left: 600px; } to { left: -100px; } }
        @keyframes walk { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-5px) rotate(5deg); } }
    </style>
</head>
<body>
    <div id="game-world">
        <div class="cloud" style="top: 30px; animation-duration: 25s;"></div>
        <div class="cloud" style="top: 80px; animation-duration: 15s;"></div>
        <div class="tree" style="animation-delay: 0s;"></div>
        <div class="tree" style="animation-delay: 1.5s;"></div>
        <div class="tree" style="animation-delay: 3s;"></div>
        <div id="hero"></div>
        <div class="ground"></div>
    </div>
</body>
</html>
