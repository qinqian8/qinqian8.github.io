        .btn {

            color: #0070f3;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: transform 0.3s;
        }

        .btn:hover {

        /* 内容区块 */
        .container {
            padding: 80px 5%;
            max-width: 1200px;
            margin: auto;

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));

        }

        .feature-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);

            .hero h1 { font-size: 2rem; }

    <script>
async function verifyAccess() {
    // 你的“锁”：这是 "MyGodotGame2024" 的哈希值
    const correctHash = "8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92";

    const userInput = prompt("请输入访问密码：");
    if (!userInput) return window.location.reload();

    // 将用户输入的字符串转换成哈希值
    const msgBuffer = new TextEncoder().encode(userInput);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const userHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

    // 对比两串哈希值是否一致
    if (userHash === correctHash) {
        alert("验证成功！");
        // 这里可以执行展示页面的逻辑，比如让遮罩层消失
    } else {
        alert("密码错误，访问拒绝！");
        window.location.href = "https://github.com"; // 报错就跳走
    }
}

verifyAccess();
</script>
